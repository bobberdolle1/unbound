# ============================================================================
# UNBOUND — Publish the website to GitHub Pages
# ============================================================================
# The Astro site under website/ was deployed by running `npm run deploy`
# (gh-pages -d dist) by hand from a developer machine. Nothing enforced it, so
# the published site drifted months behind the source. This publishes on every
# push that touches the site.
#
# It pushes the built output to the gh-pages branch, matching the repository's
# existing "Deploy from a branch" Pages configuration. To switch to the
# Actions-native flow instead, set Settings → Pages → Source to "GitHub
# Actions" and replace the deploy step with actions/upload-pages-artifact plus
# actions/deploy-pages.
# ============================================================================

name: Deploy Website

on:
  push:
    branches: [main, master]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Never cancel a half-finished deploy: the gh-pages branch would be left
# holding a partially written site.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Verify build output
        working-directory: website
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          # astro.config.mjs sets base:"/unbound"; if that were dropped every
          # asset URL on the project page would 404.
          grep -q '/unbound/' dist/index.html || {
            echo "::error::built HTML has no /unbound/ base path - check astro.config.mjs"
            exit 1
          }
          # Pages serves through Jekyll unless told otherwise, and Jekyll
          # ignores directories beginning with an underscore - which is exactly
          # where Astro puts its assets (_astro/).
          touch dist/.nojekyll

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd website/dist

          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy website from ${GITHUB_SHA::7}"

          # Force-push: gh-pages holds generated output only, so its history
          # carries no information worth preserving.
          git push -f -q \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages

          echo "Published to https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
