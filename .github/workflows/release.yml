# ============================================================================
# UNBOUND — Release packaging
# ============================================================================
# Builds and packages only the targets shipped by the release policy.
# Correctness checks live in ci.yml; this workflow only runs on tags and manual
# dispatch so a routine push does not spend half an hour building artifacts.
#
# Fixed from the previous main.yml, which could not complete:
#   - GO_VERSION was 1.23 while go.mod requires 1.25
#   - `go build -o <file> ./...` is an error: -o takes a single package
#   - the Windows job copied README_RELEASE.txt, a file that does not exist
#   - setup-node was given `cache: 'frontend'`; the only valid values are
#     npm, yarn and pnpm
#   - the Android job used `${$apk##*-}`, which is not valid shell
#   - the release body was hardcoded v2.0-era text regardless of the tag
# ============================================================================

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release (as a draft unless building a tag)?'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22.13.0'
  JAVA_VERSION: '17'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(jq -r '.info.productVersion // "0.0.0-dev"' wails.json)"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    needs: resolve-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend gate
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Version consistency gate
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          test "$(jq -r '.info.productVersion' wails.json)" = "$VERSION"
          test "$(jq -r '.version' frontend/package.json)" = "$VERSION"
          grep -F "## [$VERSION]" CHANGELOG.md
          go run . --version | grep -F "$VERSION"

      - name: Go and asset gate
        run: |
          go vet ./...
          go test ./...
          bash ./scripts/check.sh assets


  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (Wails)
    runs-on: windows-latest
    needs: [resolve-version, verify]
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend and run native release gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location frontend
          npm ci
          npm test
          npm run build
          Pop-Location
          go vet ./...
          go test ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build
        run: wails build -clean -o unbound.exe -ldflags "-H windowsgui -X unbound/engine.Version=${env:VERSION}"
        shell: pwsh

      - name: Smoke-test Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Unbound([string[]] $Arguments, [string] $Name) {
            $stdout = Join-Path $env:RUNNER_TEMP "$Name.stdout"
            $stderr = Join-Path $env:RUNNER_TEMP "$Name.stderr"
            $process = Start-Process `
              -FilePath "build/bin/unbound.exe" `
              -ArgumentList $Arguments `
              -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
            $output = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
            if ($process.ExitCode -ne 0) {
              $errorOutput = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
              throw "Windows $Name smoke test failed with exit $($process.ExitCode): $errorOutput"
            }
            return $output
          }
          $version = Invoke-Unbound @("--version") "version"
          if ($version -notmatch [regex]::Escape($env:VERSION)) {
            throw "Windows version smoke test failed: $version"
          }
          $profiles = (Invoke-Unbound @("--list-profiles", "--json") "profiles" | ConvertFrom-Json)
          if (-not $profiles.PSObject.Properties -or $profiles.PSObject.Properties.Count -eq 0) {
            throw "Windows profile catalog is empty"
          }

      - name: Package and inspect archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & scripts/build/package_windows_release.ps1 -Version $env:VERSION
          $archive = "release/unbound-v${env:VERSION}-windows-amd64.zip"
          $env:UNBOUND_WINDOWS_ARCHIVE = (Resolve-Path $archive)
          go test ./tests -run TestWindowsPackagingArchive -count=1

      - uses: actions/upload-artifact@v4
        with:
          name: unbound-windows
          path: release/*.zip
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────

  # ───────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (Wails universal)
    runs-on: macos-latest
    needs: [resolve-version, verify]
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build, package, and smoke-test
        run: ./scripts/build/build_macos_release.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: unbound-macos
          path: |
            release/*.zip
            release/*.dmg
            release/*.pkg
            release/SHA256SUMS.txt
          retention-days: 30
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - verify
      - build-windows
      - build-macos
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success' &&
      (github.ref_type == 'tag' ||
       (github.event_name == 'workflow_dispatch' && inputs.release))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/


      - name: Generate release checksums
        run: |
          set -euo pipefail
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.pkg' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  artifacts/[^/]*/#  #' > artifacts/SHA256SUMS.txt
          test -s artifacts/SHA256SUMS.txt
      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          # The old workflow pasted a fixed v2.0-era announcement into every
          # release regardless of what was actually being shipped.
          if awk -v ver="$VERSION" '
                $0 ~ "^## \\[" ver "\\]" { found = 1; next }
                found && /^## \[/        { exit }
                found                    { print }
              ' CHANGELOG.md > notes.md && [ -s notes.md ]; then
            echo "Using CHANGELOG entry for $VERSION"
          else
            echo "No CHANGELOG entry for $VERSION; falling back to generated notes" >&2
            printf 'См. полный список изменений ниже.\n' > notes.md
          fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.resolve-version.outputs.version) }}
          name: "Unbound v${{ needs.resolve-version.outputs.version }}"
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/SHA256SUMS.txt
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ contains(needs.resolve-version.outputs.version, 'dev') || contains(needs.resolve-version.outputs.version, 'beta') || contains(needs.resolve-version.outputs.version, 'rc') }}
          generate_release_notes: true
