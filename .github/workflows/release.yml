# ============================================================================
# UNBOUND — Release packaging
# ============================================================================
# Builds and packages only the targets shipped by the release policy.
# Correctness checks live in ci.yml; this workflow only runs on tags and manual
# dispatch so a routine push does not spend half an hour building artifacts.
#
# Fixed from the previous main.yml, which could not complete:
#   - GO_VERSION was 1.23 while go.mod requires 1.25
#   - `go build -o <file> ./...` is an error: -o takes a single package
#   - the Windows job copied README_RELEASE.txt, a file that does not exist
#   - setup-node was given `cache: 'frontend'`; the only valid values are
#     npm, yarn and pnpm
#   - the Android job used `${$apk##*-}`, which is not valid shell
#   - the release body was hardcoded v2.0-era text regardless of the tag
# ============================================================================

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22.13.0'
  JAVA_VERSION: '17'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(jq -r '.info.productVersion // "0.0.0-dev"' wails.json)"
          fi
          COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER ($COMMIT)"

  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    needs: resolve-version
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend gate
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Version consistency gate
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          test "$(jq -r '.info.productVersion' wails.json)" = "$VERSION"
          test "$(jq -r '.version' frontend/package.json)" = "$VERSION"
          grep -F "## [$VERSION]" CHANGELOG.md
          go run . --version | grep -F "$VERSION"
      - name: Verify annotated tag identity
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ needs.resolve-version.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-parse "$TAG^{commit}")" = "$EXPECTED_COMMIT"


      - name: Go and asset gate
        run: |
          go vet ./...
          go test ./...
          bash ./scripts/check.sh assets


  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (Wails)
    runs-on: windows-latest
    needs: [resolve-version, verify]
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      BUILD_COMMIT: ${{ needs.resolve-version.outputs.commit }}
      BUILD_DIRTY: 'false'
      BUILD_CHANNEL: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend and run native release gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location frontend
          npm ci
          npm test
          npm run build
          Pop-Location
          go vet ./...
          go test ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build
        run: wails build -clean -o unbound.exe -ldflags "-H windowsgui -X unbound/engine.Version=${env:VERSION} -X unbound/engine.BuildCommit=${env:BUILD_COMMIT} -X unbound/engine.BuildDirty=${env:BUILD_DIRTY} -X unbound/engine.BuildChannel=${env:BUILD_CHANNEL}"
        shell: pwsh

      - name: Smoke-test Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-Unbound([string[]] $Arguments, [string] $Name) {
            $stdout = Join-Path $env:RUNNER_TEMP "$Name.stdout"
            $stderr = Join-Path $env:RUNNER_TEMP "$Name.stderr"
            $process = Start-Process `
              -FilePath "build/bin/unbound.exe" `
              -ArgumentList $Arguments `
              -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
            $output = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
            if ($process.ExitCode -ne 0) {
              $errorOutput = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
              throw "Windows $Name smoke test failed with exit $($process.ExitCode): $errorOutput"
            }
            return $output
          }
          $version = Invoke-Unbound @("--version") "version"
          if ($version -notmatch [regex]::Escape($env:VERSION)) {
            throw "Windows version smoke test failed: $version"
          }
          $profiles = (Invoke-Unbound @("--list-profiles", "--json") "profiles" | ConvertFrom-Json)
          if (-not $profiles.PSObject.Properties -or $profiles.PSObject.Properties.Count -eq 0) {
            throw "Windows profile catalog is empty"
          }

      - name: Package and inspect archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & scripts/build/package_windows_release.ps1 -Version $env:VERSION
          $archive = "release/unbound-v${env:VERSION}-windows-amd64.zip"
          $env:UNBOUND_WINDOWS_ARCHIVE = (Resolve-Path $archive)
          go test ./tests -run TestWindowsPackagingArchive -count=1

      - uses: actions/upload-artifact@v4
        with:
          name: unbound-windows
          path: release/*.zip
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────

  # ───────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (Wails universal)
    runs-on: macos-latest
    needs: [resolve-version, verify]
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      UNBOUND_BUILD_COMMIT: ${{ needs.resolve-version.outputs.commit }}
      UNBOUND_BUILD_DIRTY: 'false'
      UNBOUND_BUILD_CHANNEL: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build, package, and smoke-test
        run: ./scripts/build/build_macos_release.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: unbound-macos
          path: |
            release/*.zip
            release/*.dmg
            release/*.pkg
            release/SHA256SUMS.txt
          retention-days: 30
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - resolve-version
      - verify
      - build-windows
      - build-macos
    if: >-
      always() &&
      github.ref_type == 'tag' &&
      needs.verify.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate release checksums
        run: |
          set -euo pipefail
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.pkg' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  artifacts/[^/]*/#  #' > artifacts/SHA256SUMS.txt
          test -s artifacts/SHA256SUMS.txt

      - name: Refuse release asset replacement
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacement is forbidden." >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          if awk -v ver="$VERSION" '
                $0 ~ "^## \\[" ver "\\]" { found = 1; next }
                found && /^## \[/        { exit }
                found                    { print }
              ' CHANGELOG.md > notes.md && [ -s notes.md ]; then
            echo "Using CHANGELOG entry for $VERSION"
          else
            echo "No CHANGELOG entry for $VERSION; falling back to generated notes" >&2
            printf 'См. полный список изменений ниже.\n' > notes.md
          fi
          printf '\n<!-- unbound-release-workflow-run:%s -->\n' "$GITHUB_RUN_ID" >> notes.md

      - name: Create owned draft release
        id: create-draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          PRERELEASE: ${{ contains(needs.resolve-version.outputs.version, 'dev') || contains(needs.resolve-version.outputs.version, 'beta') || contains(needs.resolve-version.outputs.version, 'rc') }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Unbound v$VERSION" --notes-file notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .draft)" = true
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .body | grep -F "<!-- unbound-release-workflow-run:$GITHUB_RUN_ID -->"

      - name: Upload draft artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.pkg' \) -print0)
          files+=(artifacts/SHA256SUMS.txt)
          test "${#files[@]}" -gt 1
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${files[@]}"

      - name: Verify draft artifact digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          remote="$(mktemp -d)"
          trap 'rm -rf "$remote"' EXIT
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir "$remote"
          cmp artifacts/SHA256SUMS.txt "$remote/SHA256SUMS.txt"
          while read -r sha file; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir "$remote"
            printf '%s  %s\n' "$sha" "$remote/$file" | sha256sum -c -
          done < artifacts/SHA256SUMS.txt

      - name: Publish verified draft
        id: publish-draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          remote="$(mktemp -d)"
          trap 'rm -rf "$remote"' EXIT
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir "$remote"
          cmp artifacts/SHA256SUMS.txt "$remote/SHA256SUMS.txt"
          while read -r sha file; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir "$remote"
            printf '%s  %s\n' "$sha" "$remote/$file" | sha256sum -c -
          done < artifacts/SHA256SUMS.txt

      - name: Remove failed owned draft
        if: >-
          failure() &&
          steps.create-draft.outputs.release_id != '' &&
          steps.publish-draft.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ steps.create-draft.outputs.release_id }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)" = true
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body | grep -F "<!-- unbound-release-workflow-run:$GITHUB_RUN_ID -->"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
